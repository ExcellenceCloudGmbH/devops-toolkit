name: Reusable ScanCode Logic

on:
  workflow_call:

jobs:
  scan-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ScanCode Toolkit
        run: |
          pip install --upgrade pip setuptools wheel
          # pluggy 1.7 no longer finds plugincode's hookspecs, so scancode
          # crashes at import ("did not find any 'pre_scan' hooks").
          pip install scancode-toolkit "pluggy<1.7"

      - name: Run ScanCode
        run: |
          scancode -clip --json-pp scancode-results.json .

      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-artifact
          path: scancode-results.json
          retention-days: 5