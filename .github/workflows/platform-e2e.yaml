name: Platform E2E Proxy

on:
  workflow_call:
    inputs:
      test_url:
        required: true
        type: string
        description: 'The URL of the dynamically deployed environment.'
      test_ref:
        required: false
        type: string
        default: 'main'
        description: 'The branch of excellence-e2e to run tests from.'
      gcp_project_id:
        required: false
        type: string
        default: 'lex-test-343008'
        description: 'The GCP Project ID where the secrets are stored.'
      gcp_wif_provider:
        required: false
        type: string
        default: 'projects/179850761406/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
        description: 'The full name of the Workload Identity Provider.'
      gcp_service_account:
        required: false
        type: string
        default: 'gh-e2e-tester@lex-test-343008.iam.gserviceaccount.com'
        description: 'The Service Account email for WIF impersonation.'
    secrets:
      INSTANCE_PASSWORD:
        required: false
        description: 'Optional password for the test environment instances.'

jobs:
  e2e:
    name: Execute E2E Tests
    uses: ExcellenceCloudGmbH/e2e-testing/.github/workflows/reusable-e2e.yml@main
    with:
      test_url: ${{ inputs.test_url }}
      test_ref: ${{ inputs.test_ref }}
      gcp_project_id: ${{ inputs.gcp_project_id }}
      gcp_wif_provider: ${{ inputs.gcp_wif_provider }}
      gcp_service_account: ${{ inputs.gcp_service_account }}
    secrets:
      INSTANCE_PASSWORD: ${{ secrets.INSTANCE_PASSWORD }}
